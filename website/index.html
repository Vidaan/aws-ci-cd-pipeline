<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Terraform Deployment</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
    }

    .badge {
      display: inline-block;
      background: #166534;
      color: #86efac;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f8fafc;
    }

    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .stack {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag {
      background: #0f172a;
      border: 1px solid #334155;
      color: #7dd3fc;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">DEPLOYED</span>
    <h1>It works.</h1>
    <p>
      This page is served from S3 via CloudFront,
      deployed automatically by GitHub Actions using Terraform.
    </p>
    <div class="stack">
      <span class="tag">Terraform</span>
      <span class="tag">GitHub Actions</span>
      <span class="tag">S3</span>
      <span class="tag">CloudFront</span>
      <span class="tag">AWS</span>
    </div>
  </div>
</body>
</html>
